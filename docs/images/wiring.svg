<circle cx="250" cy="300" r="3" fill="#222"/><circle cx="400" cy="300" r="3" fill="#222"/>
<text class="t" x="408" y="304">GND</text>
<text class="t" x="242" y="304" text-anchor="end">GND</text>
<rect class="box" x="90" y="380" width="160" height="70" rx="6"/>
<text class="t h" x="100" y="400">PT100</text>
<text class="s" x="100" y="416">3-wire probe on the block</text>
<line x1="130" y1="330" x2="130" y2="380" stroke="#555" stroke-width="2"/>
<line x1="170" y1="330" x2="170" y2="380" stroke="#555" stroke-width="2"/>
<line x1="210" y1="330" x2="210" y2="380" stroke="#555" stroke-width="2"/>
<text class="s" x="258" y="350">RTD terminals,</text><text class="s" x="258" y="364">3-wire jumper set</text>
<rect class="box" x="90" y="490" width="160" height="70" rx="6"/>
