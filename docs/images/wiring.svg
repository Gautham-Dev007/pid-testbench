<circle cx="250" cy="240" r="3" fill="#7b3fa0"/><circle cx="400" cy="240" r="3" fill="#7b3fa0"/>
<text class="t" x="408" y="244">D10  PB0</text>
<text class="t" x="242" y="244" text-anchor="end">CS</text>
