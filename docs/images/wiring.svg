<text class="s" x="760" y="136">1.3" 128×64, I2C 0x3C</text>
<line x1="600" y1="150" x2="750" y2="150" stroke="#00838f" stroke-width="2"/>
<circle cx="600" cy="150" r="3" fill="#00838f"/><circle cx="750" cy="150" r="3" fill="#00838f"/>
<text class="t" x="592" y="154" text-anchor="end">D14  PB9  SDA</text>
<text class="t" x="758" y="154">SDA</text>
<line x1="600" y1="172" x2="750" y2="172" stroke="#00838f" stroke-width="2"/>
<circle cx="600" cy="172" r="3" fill="#00838f"/><circle cx="750" cy="172" r="3" fill="#00838f"/>
<text class="t" x="592" y="176" text-anchor="end">D15  PB8  SCL</text>
<text class="t" x="758" y="176">SCL</text>
<line x1="600" y1="194" x2="750" y2="194" stroke="#c62828" stroke-width="2"/>
<circle cx="600" cy="194" r="3" fill="#c62828"/><circle cx="750" cy="194" r="3" fill="#c62828"/>
<text class="t" x="592" y="198" text-anchor="end">3V3</text>
<text class="t" x="758" y="198">VCC</text>
<line x1="600" y1="216" x2="750" y2="216" stroke="#222" stroke-width="2"/>
<circle cx="600" cy="216" r="3" fill="#222"/><circle cx="750" cy="216" r="3" fill="#222"/>
