<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica, Arial, sans-serif" font-size="13">
<style>
.box{fill:#fff;stroke:#333;stroke-width:1.4}
.nuc{fill:#f3f8fd;stroke:#4e9fd9;stroke-width:1.6}
.t{fill:#222}
.s{font-size:11px;fill:#555}
.h{font-weight:bold}
</style>
<rect width="1000" height="640" fill="#fff"/>
<rect class="nuc" x="400" y="40" width="200" height="560" rx="10"/>
<text class="t h" x="500.0" y="66" text-anchor="middle">NUCLEO-G070RB</text>
<text class="s" x="500.0" y="84" text-anchor="middle">USB (ST-LINK) = power + serial</text>
<rect class="box" x="90" y="100" width="160" height="230" rx="6"/>
<text class="t h" x="100" y="120">MAX31865</text>
<text class="s" x="100" y="136">Rref 430 Ω</text>
<line x1="250" y1="150" x2="400" y2="150" stroke="#7b3fa0" stroke-width="2"/>
<circle cx="250" cy="150" r="3" fill="#7b3fa0"/><circle cx="400" cy="150" r="3" fill="#7b3fa0"/>
<text class="t" x="408" y="154">D13  PA5  SCK</text>
<text class="t" x="242" y="154" text-anchor="end">CLK</text>
<line x1="250" y1="180" x2="400" y2="180" stroke="#7b3fa0" stroke-width="2"/>
<circle cx="250" cy="180" r="3" fill="#7b3fa0"/><circle cx="400" cy="180" r="3" fill="#7b3fa0"/>
<text class="t" x="408" y="184">D12  PA6  MISO</text>
<text class="t" x="242" y="184" text-anchor="end">SDO</text>
