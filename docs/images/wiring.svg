<text class="t" x="758" y="220">GND</text>
<rect class="box" x="750" y="270" width="160" height="70" rx="6"/>
<text class="t h" x="760" y="290">SSR</text>
<line x1="600" y1="318" x2="750" y2="318" stroke="#c9682c" stroke-width="2"/>
<circle cx="600" cy="318" r="3" fill="#c9682c"/><circle cx="750" cy="318" r="3" fill="#c9682c"/>
<text class="t" x="592" y="322" text-anchor="end">D3  PB3  TIM1_CH2</text>
<text class="t" x="758" y="322">IN (active low)</text>
<text class="s" x="750" y="358">load side → heater + heater supply</text>
<rect class="box" x="750" y="380" width="160" height="170" rx="6"/>
<text class="t h" x="760" y="400">Fan driver</text>
<text class="s" x="760" y="416">dual H-bridge</text>
<line x1="600" y1="430" x2="750" y2="430" stroke="#1e6fb8" stroke-width="2"/>
<circle cx="600" cy="430" r="3" fill="#1e6fb8"/><circle cx="750" cy="430" r="3" fill="#1e6fb8"/>
<text class="t" x="592" y="434" text-anchor="end">D5  PB4  TIM3_CH1</text>
<text class="t" x="758" y="434">IN1 / M1A</text>
<line x1="600" y1="454" x2="750" y2="454" stroke="#222" stroke-width="2"/>
<circle cx="600" cy="454" r="3" fill="#222"/><circle cx="750" cy="454" r="3" fill="#222"/>
<text class="t" x="592" y="458" text-anchor="end">D6  PB14</text>
<text class="t" x="758" y="458">IN2 / M1B</text>
<line x1="600" y1="478" x2="750" y2="478" stroke="#1e6fb8" stroke-width="2"/>
<circle cx="600" cy="478" r="3" fill="#1e6fb8"/><circle cx="750" cy="478" r="3" fill="#1e6fb8"/>
<text class="t" x="592" y="482" text-anchor="end">D9  PC7  TIM3_CH2</text>
<text class="t" x="758" y="482">IN3 / M2A</text>
<line x1="600" y1="502" x2="750" y2="502" stroke="#222" stroke-width="2"/>
<circle cx="600" cy="502" r="3" fill="#222"/><circle cx="750" cy="502" r="3" fill="#222"/>
<text class="t" x="592" y="506" text-anchor="end">D8  PA9</text>
<text class="t" x="758" y="506">IN4 / M2B</text>
<line x1="600" y1="526" x2="750" y2="526" stroke="#222" stroke-width="2"/>
<circle cx="600" cy="526" r="3" fill="#222"/><circle cx="750" cy="526" r="3" fill="#222"/>
<text class="t" x="592" y="530" text-anchor="end">GND</text>
<text class="t" x="758" y="530">GND</text>
<text class="s" x="750" y="568">outputs → fan 1, fan 2; own motor supply</text>
<text class="s" x="400" y="622">M1B / M2B are held low in firmware, so the fans only spin one way.</text>
<text class="s" x="90" y="622">All grounds common.</text>
