<circle cx="250" cy="545" r="3" fill="#222"/><circle cx="400" cy="545" r="3" fill="#222"/>
<text class="t" x="408" y="549">GND</text>
<text class="t" x="242" y="549" text-anchor="end">−</text>
<rect class="box" x="750" y="100" width="160" height="140" rx="6"/>
