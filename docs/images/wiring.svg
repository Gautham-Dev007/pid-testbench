<text class="s" x="100" y="526">passive</text>
<line x1="250" y1="515" x2="400" y2="515" stroke="#6d6d00" stroke-width="2"/>
<circle cx="250" cy="515" r="3" fill="#6d6d00"/><circle cx="400" cy="515" r="3" fill="#6d6d00"/>
