<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e6fb8"/>
    </marker>
    <style>
      .box  { fill: #fff; stroke: #333; stroke-width: 1.4; }
      .mcu  { fill: #f3f8fd; stroke: #4e9fd9; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .wire { fill: none; stroke: #333; stroke-width: 1.6; }
      .fb   { fill: none; stroke: #2e7d32; stroke-width: 1.6; }
      .cool { fill: none; stroke: #1e6fb8; stroke-width: 1.6; }
      .t    { fill: #222; text-anchor: middle; dominant-baseline: middle; }
      .s    { font-size: 11px; fill: #555; }
    </style>
  </defs>

  <rect width="900" height="360" fill="#ffffff"/>

  <!-- MCU boundary -->
  <rect class="mcu" x="128" y="58" width="340" height="290" rx="8"/>
  <text x="458" y="76" class="s" text-anchor="end" style="fill:#4e9fd9">STM32G070RB</text>

  <!-- dashboard link -->
  <rect class="box" x="560" y="10" width="160" height="36" rx="5"/>
  <text class="t" x="640" y="28">PC dashboard</text>
  <path class="wire" d="M260,82 V28 H556" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="s" x="300" y="21">USART2: telemetry 10 Hz / commands</text>

  <!-- forward path -->
  <rect class="box" x="18" y="86" width="92" height="48" rx="5"/>
  <text class="t" x="64" y="104">Setpoint</text>
  <text class="t s" x="64" y="121">20–150 °C</text>
  <path class="wire" d="M110,110 H130" marker-end="url(#a)"/>

  <circle class="box" cx="150" cy="110" r="18"/>
  <text class="t" x="150" y="111" font-size="18">Σ</text>
  <text class="s" x="120" y="99">+</text>
  <text class="s" x="136" y="146">−</text>
  <path class="wire" d="M168,110 H188" marker-end="url(#a)"/>

  <rect class="box" x="190" y="82" width="140" height="56" rx="5"/>
  <text class="t" x="260" y="100">PID controller</text>
  <text class="t s" x="260" y="120" font-size="10">MANUAL · ZN · ADAPTIVE</text>
  <path class="wire" d="M330,110 H348" marker-end="url(#a)"/>

  <rect class="box" x="350" y="86" width="100" height="48" rx="5"/>
  <text class="t" x="400" y="104">TIM1 PWM</text>
  <text class="t s" x="400" y="121">20 kHz, 0–100 %</text>
  <path class="wire" d="M450,110 H518" marker-end="url(#a)"/>

  <rect class="box" x="520" y="86" width="80" height="48" rx="5"/>
  <text class="t" x="560" y="110">SSR</text>
  <path class="wire" d="M600,110 H618" marker-end="url(#a)"/>

  <rect class="box" x="620" y="86" width="90" height="48" rx="5"/>
  <text class="t" x="665" y="110">Heater</text>
  <path class="wire" d="M710,110 H738" marker-end="url(#a)" style="stroke:#c9682c"/>
  <text class="s" x="714" y="100" style="fill:#c9682c">heat</text>

  <rect class="box" x="740" y="70" width="140" height="260" rx="8" style="fill:#fdf6f0"/>
  <text class="t" x="810" y="190">Thermal</text>
  <text class="t" x="810" y="208">block</text>

  <!-- feedback -->
  <path class="fb" d="M740,200 H712" marker-end="url(#aG)"/>
  <rect class="box" x="620" y="178" width="90" height="44" rx="5"/>
  <text class="t" x="665" y="200">PT100</text>
  <path class="fb" d="M620,200 H602" marker-end="url(#aG)"/>
  <rect class="box" x="500" y="178" width="100" height="44" rx="5"/>
  <text class="t" x="550" y="194">MAX31865</text>
  <text class="t s" x="550" y="211">3-wire, 100 ms</text>
  <path class="fb" d="M500,200 H150 V130" marker-end="url(#aG)"/>
  <text class="s" x="472" y="193">SPI1</text>
  <text class="s" x="300" y="193" style="fill:#2e7d32">temperature</text>

  <!-- fans, outside the control loop -->
  <path class="fb" d="M260,200 V260" marker-end="url(#aG)"/>
  <rect class="box" x="190" y="262" width="140" height="56" rx="5"/>
  <text class="t" x="260" y="280">Fan logic</text>
  <text class="t s" x="260" y="299">SP+2 °C / SP+5 °C onset</text>
  <path class="cool" d="M330,290 H348" marker-end="url(#aB)"/>
  <rect class="box" x="350" y="266" width="100" height="48" rx="5"/>
  <text class="t" x="400" y="284">TIM3 PWM</text>
  <text class="t s" x="400" y="301">CH1 / CH2</text>
  <path class="cool" d="M450,290 H498" marker-end="url(#aB)"/>
  <rect class="box" x="500" y="266" width="100" height="48" rx="5"/>
  <text class="t" x="550" y="290">Fan driver</text>
  <path class="cool" d="M600,290 H618" marker-end="url(#aB)"/>
  <rect class="box" x="620" y="266" width="90" height="48" rx="5"/>
  <text class="t" x="665" y="290">Fan 1 + 2</text>
  <path class="cool" d="M710,290 H738" marker-end="url(#aB)" stroke-dasharray="5 3"/>
  <text class="s" x="712" y="280" style="fill:#1e6fb8">cool</text>
  <text class="s" x="190" y="336" style="fill:#1e6fb8">fans are not fed back to the controller</text>
</svg>
